services:
  # ======================================================
  # SERVICIO DE BASE DE DATOS
  # ======================================================
  # Este servicio crea el contenedor MySQL que almacenará
  # la información utilizada posteriormente por WordPress.
  db:
    image: mysql:8.0
    container_name: wordpress-db
    restart: unless-stopped

    # Las credenciales se leen desde el archivo .env para
    # evitar escribir contraseñas directamente en este archivo.
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    # El volumen conserva los datos de MySQL aunque el
    # contenedor sea eliminado y creado nuevamente.
    volumes:
      - wordpress_db_data:/var/lib/mysql

    # El healthcheck comprueba periódicamente que MySQL esté
    # disponible y responda dentro del contenedor.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # La red permite la comunicación interna entre MySQL
    # y el servicio WordPress.
    networks:
      - wordpress_network

  # ======================================================
  # SERVICIO WORDPRESS
  # ======================================================
  # Este servicio ejecuta WordPress con el servidor Apache
  # incluido en la imagen oficial.
  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    container_name: wordpress-app
    restart: unless-stopped

    # El puerto definido en .env se publica en el puerto 80
    # del contenedor para acceder a WordPress desde Windows.
    ports:
      - "${WORDPRESS_PORT}:80"

    # WordPress utiliza el nombre del servicio db para
    # conectarse a MySQL mediante la red interna.
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}

    # WordPress espera hasta que el healthcheck de MySQL
    # indique que la base de datos está disponible.
    depends_on:
      db:
        condition: service_healthy

    # Este volumen conserva los archivos de WordPress aunque
    # el contenedor sea eliminado y creado nuevamente.
    volumes:
      - wordpress_data:/var/www/html

    networks:
      - wordpress_network

# ======================================================
# VOLÚMENES PERSISTENTES
# ======================================================
volumes:
  wordpress_db_data:
  wordpress_data:

# ======================================================
# RED PERSONALIZADA
# ======================================================
# Se utiliza una red bridge para la comunicación interna
# entre los servicios del proyecto.
networks:
  wordpress_network:
    driver: bridge
